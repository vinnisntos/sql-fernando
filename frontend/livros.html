<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca - Livros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">Sistema de Biblioteca</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="autores.html">Autores</a></li>
                <li class="nav-item"><a class="nav-link active" href="livros.html">Livros</a></li>
                <li class="nav-item"><a class="nav-link" href="membros.html">Membros</a></li>
                <li class="nav-item"><a class="nav-link" href="emprestimos.html">Emprestimos</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1>Livros</h1>

    <div id="area-mensagem"></div>

    <h4 id="titulo-formulario">Novo livro</h4>
    <form id="form-livro" class="row g-2 mb-4">
        <input type="hidden" id="id_livro">

        <div class="col-md-4">
            <label class="form-label">Titulo</label>
            <input type="text" class="form-control" id="titulo" required>
        </div>

        <div class="col-md-2">
            <label class="form-label">Ano</label>
            <input type="number" class="form-control" id="ano_publicacao">
        </div>

        <div class="col-md-3">
            <label class="form-label">Genero</label>
            <input type="text" class="form-control" id="genero">
        </div>

        <div class="col-md-3">
            <label class="form-label">Autor</label>
            <select class="form-select" id="id_autor" required>
                <option value="">Selecione...</option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">Qtd. total de exemplares</label>
            <input type="number" class="form-control" id="qtd_total" min="0" required>
        </div>

        <div class="col-md-10 d-flex align-items-end">
            <button type="submit" class="btn btn-primary me-2">Salvar</button>
            <button type="button" class="btn btn-secondary" id="btn-cancelar" style="display:none;">Cancelar</button>
        </div>
    </form>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Titulo</th>
                <th>Autor</th>
                <th>Ano</th>
                <th>Genero</th>
                <th>Total</th>
                <th>Disponivel</th>
                <th>Acoes</th>
            </tr>
        </thead>
        <tbody id="tabela-livros">
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/livros.js"></script>
</body>
</html>
