<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca - Emprestimos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">Sistema de Biblioteca</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="autores.html">Autores</a></li>
                <li class="nav-item"><a class="nav-link" href="livros.html">Livros</a></li>
                <li class="nav-item"><a class="nav-link" href="membros.html">Membros</a></li>
                <li class="nav-item"><a class="nav-link active" href="emprestimos.html">Emprestimos</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1>Emprestimos</h1>

    <div id="area-mensagem"></div>

    <h4>Novo emprestimo</h4>
    <p class="text-muted">Somente livros com pelo menos 1 exemplar disponivel aparecem na lista.</p>
    <form id="form-emprestimo" class="row g-2 mb-4">
        <div class="col-md-5">
            <label class="form-label">Livro</label>
            <select class="form-select" id="id_livro" required>
                <option value="">Selecione...</option>
            </select>
        </div>

        <div class="col-md-5">
            <label class="form-label">Membro</label>
            <select class="form-select" id="id_membro" required>
                <option value="">Selecione...</option>
            </select>
        </div>

        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary">Emprestar</button>
        </div>
    </form>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Livro</th>
                <th>Membro</th>
                <th>Emprestado em</th>
                <th>Devolucao prevista</th>
                <th>Devolucao real</th>
                <th>Status</th>
                <th>Acoes</th>
            </tr>
        </thead>
        <tbody id="tabela-emprestimos">
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/emprestimos.js"></script>
</body>
</html>
