<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca - Autores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">Sistema de Biblioteca</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="autores.html">Autores</a></li>
                <li class="nav-item"><a class="nav-link" href="livros.html">Livros</a></li>
                <li class="nav-item"><a class="nav-link" href="membros.html">Membros</a></li>
                <li class="nav-item"><a class="nav-link" href="emprestimos.html">Emprestimos</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1>Autores</h1>

    <div id="area-mensagem"></div>

    <h4 id="titulo-formulario">Novo autor</h4>
    <form id="form-autor" class="row g-2 mb-4">
        <input type="hidden" id="id_autor">

        <div class="col-md-6">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Nacionalidade</label>
            <input type="text" class="form-control" id="nacionalidade">
        </div>

        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary me-2">Salvar</button>
            <button type="button" class="btn btn-secondary" id="btn-cancelar" style="display:none;">Cancelar</button>
        </div>
    </form>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Nacionalidade</th>
                <th>Acoes</th>
            </tr>
        </thead>
        <tbody id="tabela-autores">
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/autores.js"></script>
</body>
</html>
